name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Docker Hub repository, e.g. "myuser/gera2-site". Set as a repository variable.
  IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          test -n "$IMAGE" || { echo "::error::Repository variable DOCKERHUB_IMAGE is not set"; exit 1; }

      - id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Dokploy deploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          test -n "$DOKPLOY_WEBHOOK_URL" || { echo "::error::Secret DOKPLOY_WEBHOOK_URL is not set"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST -H "Content-Type: application/json" -d '{}' \
            "$DOKPLOY_WEBHOOK_URL"
          echo "Deploy triggered for image tag ${{ needs.build-and-push.outputs.sha_tag }}"
